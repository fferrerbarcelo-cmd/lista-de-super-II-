
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Súper II</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="contenedor">
        <header>
            <span class="icono">🛒</span>
            <h1>Lista de Súper II</h1>
            <p>Organizá tus productos de forma sencilla.</p>
        </header>

        <section class="tarjeta">
            <h2>Lista final</h2>
            <p class="descripcion">
                Estos son los productos que quedaron después de agregar
                y quitar elementos.
            </p>

            <ul id="listaFinal"></ul>

            <div class="resultado">
                <span>Productos finales</span>
                <strong id="cantidadFinal">0</strong>
            </div>
        </section>

        <section class="tarjeta">
            <h2>Operaciones realizadas</h2>
            <div id="operaciones"></div>
        </section>

        <footer>
            <p>Proyecto de JavaScript · Arrays</p>
        </footer>
    </main>
</body>
</html>
