
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Súper - Parte 2</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f2;
            color: #26352b;
            padding: 50px 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header span {
            font-size: 42px;
        }

        h1 {
            color: #267447;
            margin: 12px 0;
            font-size: 29px;
        }

        header p {
            color: #78857c;
            line-height: 1.5;
        }

        h2 {
            font-size: 19px;
            margin: 25px 0 12px;
        }

        .step {
            background: #f7faf7;
            border: 1px solid #e2ebe3;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 12px;
        }

        .step h3 {
            font-size: 15px;
            color: #267447;
            margin-bottom: 8px;
        }

        .step p {
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .footer {
            text-align: center;
            color: #8b968e;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <span>🛒</span>
            <h1>Lista de Súper</h1>
            <p>Parte 2 · Manipulación de arreglos en JavaScript</p>
        </header>

        <h2>Resultados del ejercicio</h2>
        <div id="resultados"></div>

        <p class="footer">U11 · ARRAYS JAVASCRIPT</p>
    </main>

    <script>
        // Lista inicial
        let productos = ["Sal", "Leche", "Arroz"];

        console.log("Lista inicial:", productos);

        // 1. Agregar dos productos al final usando push()
        productos.push("Pan");
        productos.push("Huevos");

        console.log("Después de push():", productos);

        // 2. Agregar dos productos al principio usando unshift()
        productos.unshift("Manzanas");
        productos.unshift("Bananas");

        console.log("Después de unshift():", productos);

        // 3. Mostrar la cantidad total de productos
        console.log("Cantidad total de productos:", productos.length);

        // 4. Remover el último producto y guardarlo en noHabia
        let noHabia = productos.pop();

        console.log("Producto removido del final:", noHabia);

        // 5. Remover el primer producto y guardarlo en comprado
        let comprado = productos.shift();

        console.log("Producto removido del principio:", comprado);

        // 6. Mostrar el tamaño final de la lista
        console.log("Tamaño final de la lista:", productos.length);
        console.log("Lista final:", productos);

        // Mostrar los resultados también en la página
        const resultados = document.getElementById("resultados");

        function mostrarResultado(titulo, contenido) {
            const tarjeta = document.createElement("section");
            tarjeta.className = "step";

            const encabezado = document.createElement("h3");
            encabezado.textContent = titulo;

            const texto = document.createElement("p");
            texto.textContent = contenido;

            tarjeta.appendChild(encabezado);
            tarjeta.appendChild(texto);
            resultados.appendChild(tarjeta);
        }

        mostrarResultado("1. Lista inicial", "Sal, Leche, Arroz");
        mostrarResultado("2. Después de push()", "Sal, Leche, Arroz, Pan, Huevos");
        mostrarResultado("3. Después de unshift()", "Bananas, Manzanas, Sal, Leche, Arroz, Pan, Huevos");
        mostrarResultado("4. Cantidad total", "7 productos");
        mostrarResultado("5. Variable noHabia", noHabia);
        mostrarResultado("6. Variable comprado", comprado);
        mostrarResultado("7. Tamaño final", productos.length + " productos");
        mostrarResultado("8. Lista final", productos.join(", "));
    </script>
</body>
</html>
